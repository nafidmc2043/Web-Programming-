<html>
<head>
      <title> form validation </title>
</head>

<body> 
      <h1> FORM VALIDATION </h1>
      
<form name="form" action="" onsubmit=" return validatefrom()"> 

      <label>Name:</label>
      
      <select>
        <option>Mr</option>
        <option>Ms</option>
        <option>Miss</option>
      </select>
      
      <input type ="text" id="fname" name="fname" placeholder="Enter your name" > <br> <br>
      
      
        <label>phone:</label>
        <select>
        <option>+91</option>
        <option>+23</option>
        <option>+44</option>
      </select>
      
      
      <input type ="phone" id="pnum" name="pnum" placeholder="Enter mobile number" > <br> <br>
      
      <label>Email:</label>
      <input type ="text" id="email" name="email" placeholder="Enter email" > <br> <br>
      
      <button type="submit">Submit</button>

</form>

  
<script>

      function validatefrom(){
          
          var fname = document.form.fname.value.trim();
          var pnum = document.form.pnum.value.trim();
          var email = document.form.email.value.trim();
          
          if (fname == ""){
            alert("Enter your name");
            document.form.fname.focus();
            return false;
          }
            else if(!/^[a-zA-Z\s]+$/.test(fname)){
            alert("Enter your name");
            document.form.fname.focus();
            return false;
          }
          
          if(pnum == ""){
           alert("Enter mobile number");
           document.form.pnum.focus();
           return false;
          }
          
          else if(!/^[0-9]{10}$/.test(pnum)){
           alert("Enter a valid 10-digit mobile number");
           document.form.pnum.focus();
           return false;
          }
          
          if(email == ""){
           alert("Enter email");
           document.form.email.focus();
           return false;
          }
          
          else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
          alert("Enter valid Email");
          document.form.email.focus();
          return false;
          }
          
          alert("form submitted successfully");
          return true;
          }

</script>
</body>
</html>
